; Loaded by `composer run dev` via PHP_INI_SCAN_DIR (see bin/dev-serve).
; `php artisan serve` spawns `php -S` from public/ without parent `-d` flags,
; so upload limits must live in a scanned ini with an absolute scan path.
;
; Keep these above sentria.legislation.import_zip_max_kb (default 200 MB)
; plus the CSV and multipart overhead.
upload_max_filesize = 256M
post_max_size = 256M
