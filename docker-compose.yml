services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sentria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentria
      POSTGRES_USER: sentria
      POSTGRES_PASSWORD: sentria
    ports:
      - "5432:5432"
    volumes:
      - sentria_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentria -d sentria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sentria_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional production malware-scan adapter. Not required for local development
  # (the application uses the no-op scanner when MALWARE_SCANNER=null).
  clamav:
    image: clamav/clamav:stable
    container_name: sentria-clamav
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - sentria_clamav:/var/lib/clamav

networks:
  default:
    name: sentria

volumes:
  sentria_pgdata:
  sentria_redis:
  sentria_clamav:
